parameters:
  branch: ""

  # Runtime condition applied to every job. Declared here so azure-pipelines.yml
  # owns the opt-in logic; the template applies it consistently to all jobs.
  # Defaults to 'succeeded()' so the template is usable standalone.
  #
  # In production use (azure-pipelines.yml), this is set to skip all jobs when
  # the PR source branch ends with '-automated' or '-no-rebuild':
  #   - '-automated': auto-generated by this pipeline; prevents infinite loops
  #     where the generated branch's own PR would re-trigger regeneration.
  #   - '-no-rebuild': opt-out convention for PRs that should not regenerate
  #     packages (e.g. CI-only or documentation changes).
  job_condition: "succeeded()"

jobs:
- job: install_source_dependencies_3_9
  displayName: Install source dependencies Python 3.9
  condition: and(succeeded(), ${{ parameters.job_condition }})
  pool:
    vmImage: ubuntu-22.04
  steps:
  - template: template.yml
    parameters:
      python_version: 3.9
  - script: |
      set -e
      git checkout ${{ parameters.branch }} || git checkout -b ${{ parameters.branch }} origin/$(System.PullRequest.SourceBranch)
      git merge origin/$(System.PullRequest.SourceBranch)
      git push -u origin ${{ parameters.branch }}
    env:
      GH_ACCESS_TOKEN: $(GITHUB_ACCESS_TOKEN)
    displayName: Create branch if not exists or update
  - script: |
      set -e
      git checkout ${{ parameters.branch }}
      python update_requirements.py --clean-pip
    displayName: Generate all explicit_requirements 3.9
    workingDirectory: resources/python
  - script: |
      set -e
      ./install_source_only.sh
      git commit --allow-empty -a -m "Update source requirements 3.9"
      git push origin ${{ parameters.branch }}
    env:
      GH_ACCESS_TOKEN: $(GITHUB_ACCESS_TOKEN)
    displayName: Update source requirements 3.9
    workingDirectory: resources/python

- job: install_source_dependencies_3_10
  displayName: Install source dependencies Python 3.10
