parameters:
  branch: ""

  # Runtime condition applied to the detect_requirements_changes gate job, which
  # every other job depends on, so it applies to all jobs. Declared here so
  # azure-pipelines.yml owns the opt-in logic.
  # Defaults to 'succeeded()' so the template is usable standalone.
  #
  # In production use (azure-pipelines.yml), this is set to skip all jobs when
  # the PR source branch ends with '-automated' or '-no-rebuild':
  #   - '-automated': auto-generated by this pipeline; prevents infinite loops
  #     where the generated branch's own PR would re-trigger regeneration.
  #   - '-no-rebuild': opt-out convention for PRs that should not regenerate
  #     packages (e.g. CI-only or documentation changes).
  job_condition: "succeeded()"

jobs:
# Gate job: the regeneration only runs when the PR changes a requirements.txt
# file. Every other job chains from install_source_dependencies_3_9 with
# 'succeeded()', so they are all skipped when this reports no change.
- job: detect_requirements_changes
  displayName: Detect requirements.txt changes
  condition: and(succeeded(), ${{ parameters.job_condition }})
  pool:
    vmImage: ubuntu-latest
  steps:
  # Depth 2 so the parents of the PR merge commit are available.
  - checkout: self
    fetchDepth: 2
  - bash: |
      set -e
      # PR builds check out the GitHub merge commit: parent 1 is the target
      # branch tip, so this diff is exactly what the PR changes.
      if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
        changed=$(git diff --name-only HEAD^1 HEAD)
      else
        echo "Not a merge commit, running the rebuild to be safe."
        changed="requirements.txt"
      fi
      echo "Changed files:"
      echo "$changed"
      # Generated bin/*/explicit_requirements.txt files are not matched.
      if echo "$changed" | grep -Eq '(^|/)requirements\.txt$'; then
        echo "##vso[task.setvariable variable=changed;isOutput=true]true"
      else
        echo "No requirements.txt changes, skipping the regeneration."
        echo "##vso[task.setvariable variable=changed;isOutput=true]false"
      fi
    displayName: Check for requirements.txt changes
    name: requirements

- job: install_source_dependencies_3_9
  displayName: Install source dependencies Python 3.9
  dependsOn: detect_requirements_changes
  condition: >-
    and(
      succeeded(),
      eq(
        dependencies.detect_requirements_changes.outputs['requirements.changed'],
        'true'
      )
    )
  pool:
    vmImage: ubuntu-22.04
  steps:
  - template: template.yml
    parameters:
      python_version: 3.9
  - script: |
      set -e
      git checkout ${{ parameters.branch }} || git checkout -b ${{ parameters.branch }} origin/$(System.PullRequest.SourceBranch)
      git merge origin/$(System.PullRequest.SourceBranch)
      git push -u origin ${{ parameters.branch }}
    env:
      GH_ACCESS_TOKEN: $(GITHUB_ACCESS_TOKEN)
    displayName: Create branch if not exists or update
  - script: |
      set -e
      git checkout ${{ parameters.branch }}
      python update_requirements.py --clean-pip
    displayName: Generate all explicit_requirements 3.9
    workingDirectory: resources/python
  - script: |
      set -e
      ./install_source_only.sh
      git commit --allow-empty -a -m "Update source requirements 3.9"
      git push origin ${{ parameters.branch }}
    env:
      GH_ACCESS_TOKEN: $(GITHUB_ACCESS_TOKEN)
    displayName: Update source requirements 3.9
    workingDirectory: resources/python

